<!doctype html>
<html lang="zh-CN" data-brand="cumt" data-theme="light" data-font-size="m">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="app-base" content="APP_BASE"><title>全国安全生产风险智能研判与预测</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6Z' fill='%231E3264'/%3E%3C/svg%3E"><link rel="stylesheet" href="/assets/vendor/tokens.css"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/design.css"></head>
<body>
<div class="app" id="app">
  <main class="main"><div id="content" class="content"><section id="startup-state" class="startup-state" role="status" aria-live="polite"><h1>安全生产风险研判与预测</h1><p id="startup-message">正在加载智能体…</p><button id="startup-retry" type="button" class="btn primary" hidden>重新加载</button></section></div></main>
</div>
<div id="modal-host"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
  const content = document.getElementById('content');
  const startup = document.getElementById('startup-state');
  const message = document.getElementById('startup-message');
  const retry = document.getElementById('startup-retry');
  let ready = false;
  let timer;
  window.agentStartup = {
    complete() { ready = true; clearTimeout(timer); },
    fail(detail) {
      if (ready) return;
      clearTimeout(timer);
      startup.setAttribute('role', 'alert');
      message.textContent = detail || '页面加载失败，请重新加载';
      retry.hidden = false;
      content.replaceChildren(startup);
    }
  };
  retry.onclick = () => {
    const url = new URL(location.href);
    url.searchParams.set('_reload', String(Date.now()));
    location.replace(url.href);
  };
  window.addEventListener('error', event => {
    if (event.target.id === 'agent-script' || event instanceof ErrorEvent) window.agentStartup.fail('页面脚本加载失败，请重新加载');
  }, true);
  window.addEventListener('unhandledrejection', () => window.agentStartup.fail('页面初始化失败，请重新加载'));
  timer = setTimeout(() => window.agentStartup.fail('加载超时，请重新加载'), 25000);
})();
</script>
<script src="/assets/vendor/echarts.min.js"></script>
<script id="agent-script" type="module" src="/assets/app.js"></script>
</body></html>
